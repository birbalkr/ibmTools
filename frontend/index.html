<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IBM Cloud Learning Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ibm-blue:#0F62FE;
  --ibm-blue-dark:#0043CE;
  --ibm-blue-light:#EDF5FF;
  --ibm-blue-mid:#D0E2FF;
  --ibm-gray-10:#F4F4F4;
  --ibm-gray-20:#E0E0E0;
  --ibm-gray-40:#A8A8A8;
  --ibm-gray-60:#6F6F6F;
  --ibm-gray-80:#393939;
  --ibm-gray-100:#161616;
  --ibm-cool:#697077;
  --ibm-green:#24A148;
  --ibm-green-light:#DEFBE6;
  --ibm-teal:#009D9A;
  --ibm-teal-light:#D9FBFB;
  --ibm-purple:#8A3FFC;
  --ibm-purple-light:#F6F2FF;
  --ibm-orange:#FF832B;
  --ibm-orange-light:#FFF2E8;
  --ibm-red:#DA1E28;
  --bg:#FAFAFA;
  --surface:#FFFFFF;
  --border:#E0E0E0;
  --text:#161616;
  --muted:#6F6F6F;
  --sans:'IBM Plex Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',monospace;
}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;font-size:14px}

header{background:var(--ibm-gray-100);color:#fff;padding:0 24px;height:48px;display:flex;align-items:center;gap:16px;flex-shrink:0}
.ibm-logo{display:flex;align-items:center;gap:10px}
.ibm-stripes{display:flex;flex-direction:column;gap:2px}
.ibm-stripes span{display:block;height:3px;background:#fff;width:24px}
.ibm-stripes span:nth-child(2){width:18px}
.ibm-stripes span:nth-child(3){width:24px}
.header-title{font-size:14px;font-weight:400;letter-spacing:0.01em;color:#fff}
.header-divider{width:1px;height:20px;background:#525252}
.header-sub{font-size:12px;color:#A8A8A8;font-weight:300}

.layout{display:flex;flex:1;overflow:hidden;height:calc(100vh - 48px)}

.sidebar{width:240px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto}
.sidebar-section{padding:16px 0}
.sidebar-heading{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);padding:0 16px 8px}
.step-btn{display:flex;align-items:center;gap:0;padding:10px 16px;border:none;background:none;cursor:pointer;font-family:var(--sans);font-size:13px;color:var(--ibm-gray-80);text-align:left;width:100%;transition:background 0.1s;border-left:3px solid transparent;line-height:1.4}
.step-btn:hover{background:var(--ibm-gray-10)}
.step-btn.active{background:var(--ibm-blue-light);border-left-color:var(--ibm-blue);color:var(--ibm-blue-dark);font-weight:500}
.step-btn.done{color:var(--ibm-green);border-left-color:var(--ibm-green-light)}
.step-num{width:20px;height:20px;border-radius:50%;border:1.5px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;flex-shrink:0;margin-right:10px}
.step-btn.done .step-num{background:var(--ibm-green);border-color:var(--ibm-green);color:#fff}
.step-btn.active .step-num{background:var(--ibm-blue);border-color:var(--ibm-blue);color:#fff}
.step-label{flex:1;min-width:0}

.progress-bar-wrap{padding:12px 16px;border-top:1px solid var(--border);margin-top:auto}
.progress-label{font-size:11px;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between}
.progress-bar{height:4px;background:var(--ibm-gray-20);border-radius:0}
.progress-fill{height:100%;background:var(--ibm-blue);border-radius:0;transition:width 0.3s}

.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}

.step-banner{padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.step-banner-left{display:flex;align-items:center;gap:12px}
.step-tag{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.06em;background:var(--ibm-blue-light);color:var(--ibm-blue-dark);padding:3px 8px}
.step-banner-title{font-size:15px;font-weight:500;color:var(--text)}
.step-banner-desc{font-size:12px;color:var(--muted);margin-top:2px}
.btn-row{display:flex;gap:8px}
.nav-btn{font-size:12px;font-family:var(--sans);color:var(--muted);background:none;border:1px solid var(--border);padding:5px 12px;cursor:pointer;transition:all 0.1s}
.nav-btn:hover{border-color:var(--ibm-gray-40);color:var(--text)}
.nav-btn.primary{background:var(--ibm-blue);color:#fff;border-color:var(--ibm-blue)}
.nav-btn.primary:hover{background:var(--ibm-blue-dark);border-color:var(--ibm-blue-dark)}

.messages{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:14px}

.welcome-card{background:var(--surface);border:1px solid var(--border);padding:20px 24px;margin-bottom:8px}
.welcome-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.tool-icon{width:40px;height:40px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tool-icon svg{width:28px;height:28px}
.welcome-title{font-size:16px;font-weight:500;color:var(--text)}
.welcome-subtitle{font-size:13px;color:var(--muted);margin-top:2px}
.welcome-body{font-size:13.5px;color:var(--ibm-gray-80);line-height:1.65;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-family:var(--sans);background:none;border:1px solid var(--ibm-blue);color:var(--ibm-blue);padding:5px 10px;cursor:pointer;transition:all 0.1s}
.chip:hover{background:var(--ibm-blue);color:#fff}

.msg-row{display:flex;gap:10px;animation:slideIn 0.25s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg-row.user{flex-direction:row-reverse}
.msg-avatar{width:28px;height:28px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;margin-top:2px}
.msg-avatar.bot{background:var(--ibm-blue);color:#fff;font-family:var(--mono)}
.msg-avatar.user{background:var(--ibm-gray-20);color:var(--ibm-gray-80)}
.bubble{max-width:72%;padding:10px 14px;font-size:13.5px;line-height:1.65}
.bubble.bot{background:var(--surface);border:1px solid var(--border);color:var(--text)}
.bubble.user{background:var(--ibm-gray-100);color:#fff}
.bubble p{margin:0 0 8px}
.bubble p:last-child{margin:0}
.bubble ul,.bubble ol{padding-left:18px;margin:6px 0}
.bubble li{margin:3px 0}
.bubble code{font-family:var(--mono);font-size:12px;background:var(--ibm-gray-10);padding:1px 5px;border:1px solid var(--border)}
.bubble.user code{background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.2);color:#fff}
.bubble pre{font-family:var(--mono);font-size:12px;background:var(--ibm-gray-100);color:#f4f4f4;padding:12px;margin:8px 0;overflow-x:auto;line-height:1.5}

.typing-row{display:flex;gap:10px}
.typing-dots{display:flex;gap:4px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--border)}
.dot{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:bounce 1.1s infinite}
.dot:nth-child(2){animation-delay:0.18s}
.dot:nth-child(3){animation-delay:0.36s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:0.4}30%{transform:translateY(-4px);opacity:1}}

.input-area{padding:14px 24px;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0}
.input-wrap{display:flex;gap:0;border:1px solid var(--ibm-gray-40);transition:border-color 0.15s}
.input-wrap:focus-within{border-color:var(--ibm-blue);outline:2px solid var(--ibm-blue-mid)}
textarea{flex:1;background:none;border:none;outline:none;font-family:var(--sans);font-size:13.5px;color:var(--text);resize:none;padding:10px 14px;min-height:40px;max-height:100px;line-height:1.5}
textarea::placeholder{color:var(--ibm-gray-40)}
.send-btn{width:44px;background:var(--ibm-blue);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 0.1s;flex-shrink:0}
.send-btn:hover{background:var(--ibm-blue-dark)}
.send-btn:disabled{background:var(--ibm-gray-20);cursor:default}
.send-btn svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.send-btn:disabled svg{stroke:var(--ibm-gray-40)}
.input-footer{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:11px;color:var(--muted)}
.kbd{font-family:var(--mono);font-size:10px;background:var(--ibm-gray-10);border:1px solid var(--border);padding:1px 5px}
</style>
</head>
<body>

<header>
  <div class="ibm-logo">
    <div class="ibm-stripes"><span></span><span></span><span></span></div>
  </div>
  <div class="header-divider"></div>
  <span class="header-title">IBM Cloud</span>
  <div class="header-divider"></div>
  <span class="header-sub">Learning Assistant</span>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-heading">Learning path</div>
      <button class="step-btn active" data-step="0" onclick="switchStep(0)">
        <span class="step-num">1</span>
        <span class="step-label">IBM Cloud overview</span>
      </button>
      <button class="step-btn" data-step="1" onclick="switchStep(1)">
        <span class="step-num">2</span>
        <span class="step-label">Account &amp; console setup</span>
      </button>
      <button class="step-btn" data-step="2" onclick="switchStep(2)">
        <span class="step-num">3</span>
        <span class="step-label">IBM Cloud CLI</span>
      </button>
      <button class="step-btn" data-step="3" onclick="switchStep(3)">
        <span class="step-num">4</span>
        <span class="step-label">Resource groups &amp; IAM</span>
      </button>
      <button class="step-btn" data-step="4" onclick="switchStep(4)">
        <span class="step-num">5</span>
        <span class="step-label">Compute: VPC &amp; VSI</span>
      </button>
      <button class="step-btn" data-step="5" onclick="switchStep(5)">
        <span class="step-num">6</span>
        <span class="step-label">Container &amp; Kubernetes (IKS)</span>
      </button>
      <button class="step-btn" data-step="6" onclick="switchStep(6)">
        <span class="step-num">7</span>
        <span class="step-label">IBM Watson AI services</span>
      </button>
      <button class="step-btn" data-step="7" onclick="switchStep(7)">
        <span class="step-num">8</span>
        <span class="step-label">Storage &amp; databases</span>
      </button>
      <button class="step-btn" data-step="8" onclick="switchStep(8)">
        <span class="step-num">9</span>
        <span class="step-label">DevOps &amp; toolchains</span>
      </button>
      <button class="step-btn" data-step="9" onclick="switchStep(9)">
        <span class="step-num">10</span>
        <span class="step-label">Monitoring &amp; logging</span>
      </button>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-label"><span>Progress</span><span id="prog-pct">0%</span></div>
      <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
    </div>
  </aside>

  <div class="main">
    <div class="step-banner">
      <div class="step-banner-left">
        <span class="step-tag" id="banner-tag">Step 1 of 10</span>
        <div>
          <div class="step-banner-title" id="banner-title">IBM Cloud overview</div>
          <div class="step-banner-desc" id="banner-desc">Understand the platform, services, and global infrastructure</div>
        </div>
      </div>
      <div class="btn-row">
        <button class="nav-btn" id="prev-btn" onclick="prevStep()" disabled>&#8592; Prev</button>
        <button class="nav-btn primary" id="next-btn" onclick="nextStep()">Next &#8594;</button>
      </div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-area">
      <div class="input-wrap">
        <textarea id="user-input" placeholder="Ask anything about this step…" rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="send-btn" onclick="sendMessage()" aria-label="Send">
          <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
      <div class="input-footer">
        <span>Powered by Claude &middot; IBM Cloud Learning Assistant</span>
        <span>Press <kbd class="kbd">Enter</kbd> to send &middot; <kbd class="kbd">Shift+Enter</kbd> for new line</span>
      </div>
    </div>
  </div>
</div>

<script>
const STEPS = [
  {
    title:"IBM Cloud overview",
    desc:"Understand the platform, services, and global infrastructure",
    icon:"cloud",
    system:`You are an IBM Cloud expert educator. The student is on Step 1: IBM Cloud Overview. Teach them about IBM Cloud's platform, its global data center regions (MZRs, SZRs), the catalog of 170+ services, IBM's hybrid cloud strategy with Red Hat OpenShift, and how it compares to AWS/Azure/GCP. Be concise, structured, and use real IBM Cloud terminology. When listing commands, use code formatting. Keep answers focused on IBM Cloud.`,
    intro:"Welcome to Step 1! Let's start with what IBM Cloud is, how it's structured, and why enterprises choose it.",
    chips:["What is IBM Cloud?","How many regions does IBM Cloud have?","How does IBM Cloud compare to AWS?","What is IBM's hybrid cloud strategy?"]
  },
  {
    title:"Account & console setup",
    desc:"Create your IBM Cloud account and navigate the console",
    icon:"user",
    system:`You are an IBM Cloud expert educator. The student is on Step 2: Account & Console Setup. Guide them through creating a free Lite account at cloud.ibm.com, navigating the console dashboard, understanding account types (Lite, Pay-As-You-Go, Subscription), setting up the catalog, and using the Resource List. Mention the IBM Cloud console URL and key UI sections. Be step-by-step and practical.`,
    intro:"In Step 2 we set up your IBM Cloud account and get comfortable with the console UI.",
    chips:["How do I create a free IBM Cloud account?","What is a Lite account?","How do I navigate the IBM Cloud catalog?","What's on the IBM Cloud dashboard?"]
  },
  {
    title:"IBM Cloud CLI",
    desc:"Install, configure, and use the IBM Cloud CLI and plugins",
    icon:"terminal",
    system:`You are an IBM Cloud expert educator. The student is on Step 3: IBM Cloud CLI. Teach them how to install the IBM Cloud CLI (ibmcloud), log in with 'ibmcloud login', target a region and resource group, install plugins (like ibmcloud ks for Kubernetes, ibmcloud cr for container registry), and run common commands. Provide real CLI commands in code blocks. Explain flags like --sso, -r for region, -g for resource group.`,
    intro:"Step 3 covers the IBM Cloud CLI — your primary tool for scripting and automation.",
    chips:["How do I install the IBM Cloud CLI?","How do I log in with ibmcloud login?","What plugins should I install?","Show me common ibmcloud commands"]
  },
  {
    title:"Resource groups & IAM",
    desc:"Manage access, users, roles, and resource organization",
    icon:"shield",
    system:`You are an IBM Cloud expert educator. The student is on Step 4: Resource Groups & IAM (Identity and Access Management). Explain IBM Cloud IAM concepts: resource groups (for organizing services), access groups, IAM policies, platform vs service roles, API keys, service IDs, and trusted profiles. Show CLI commands like 'ibmcloud iam access-groups' and how to assign roles. Be precise with IBM-specific terminology.`,
    intro:"Step 4 is about IBM Cloud IAM — how to control who can access what across your account.",
    chips:["What is a resource group?","How does IBM Cloud IAM work?","What are platform vs service roles?","How do I create an API key?"]
  },
  {
    title:"Compute: VPC & VSI",
    desc:"Launch virtual servers inside a Virtual Private Cloud",
    icon:"server",
    system:`You are an IBM Cloud expert educator. The student is on Step 5: Compute — VPC and Virtual Server Instances (VSI). Explain IBM Cloud VPC (Virtual Private Cloud) architecture: subnets, security groups, ACLs, public gateways, floating IPs. Show how to provision a VSI (Virtual Server Instance) via the console and CLI. Include the ibmcloud is commands for VPC. Mention profiles (Balanced, Compute, Memory), images, SSH keys, and storage volumes.`,
    intro:"Step 5 covers IBM Cloud VPC and how to launch and manage Virtual Server Instances.",
    chips:["What is IBM Cloud VPC?","How do I create a VPC?","How do I launch a VSI?","What are VSI profiles?"]
  },
  {
    title:"Container & Kubernetes (IKS)",
    desc:"Deploy containerized apps with IBM Kubernetes Service",
    icon:"box",
    system:`You are an IBM Cloud expert educator. The student is on Step 6: Containers and Kubernetes using IBM Kubernetes Service (IKS). Explain IKS cluster creation (free vs standard), connecting kubectl to the cluster via 'ibmcloud ks cluster config', IBM Container Registry (ICR) for storing images, deploying apps with kubectl apply, and IBM Cloud Secrets Manager integration. Also mention OpenShift on IBM Cloud (ROKS) as an alternative. Use real commands and YAML examples where helpful.`,
    intro:"Step 6 dives into IBM Kubernetes Service — IBM's managed K8s offering for running containers at scale.",
    chips:["How do I create an IKS cluster?","How do I push images to IBM Container Registry?","How do I connect kubectl to IKS?","What is ROKS vs IKS?"]
  },
  {
    title:"IBM Watson AI services",
    desc:"Integrate NLP, vision, speech, and ML with Watson APIs",
    icon:"brain",
    system:`You are an IBM Cloud expert educator. The student is on Step 7: IBM Watson AI Services. Cover the main Watson services: Watson Assistant (chatbots), Watson Discovery (NLP/document search), Watson Natural Language Understanding, Watson Speech to Text & Text to Speech, Watson Studio (ML/AI development), and Watson Machine Learning. Show how to provision a service from the catalog, get credentials (API key + URL), and make a basic API call. Mention IBM watsonx as the next-gen AI platform.`,
    intro:"Step 7 explores IBM Watson — the AI and ML services built into IBM Cloud, from chatbots to custom models.",
    chips:["What Watson services are available?","How do I create a Watson Assistant?","What is IBM watsonx?","How do I call a Watson API?"]
  },
  {
    title:"Storage & databases",
    desc:"Use object storage, block storage, and managed databases",
    icon:"database",
    system:`You are an IBM Cloud expert educator. The student is on Step 8: Storage & Databases on IBM Cloud. Cover IBM Cloud Object Storage (COS) — buckets, endpoints, HMAC credentials, and the ibmcloud cos CLI. Explain block storage for VPC and file storage. For databases, cover IBM Databases for PostgreSQL, MongoDB, Redis, Elasticsearch, etcd, and IBM Db2 on Cloud. Show how to provision, connect, and take backups. Include the connection string format.`,
    intro:"Step 8 covers IBM Cloud's storage options and managed database services.",
    chips:["How does IBM Cloud Object Storage work?","How do I create a Databases for PostgreSQL instance?","What managed databases does IBM offer?","How do I back up my database?"]
  },
  {
    title:"DevOps & toolchains",
    desc:"Set up CI/CD pipelines with IBM Cloud toolchains",
    icon:"git-branch",
    system:`You are an IBM Cloud expert educator. The student is on Step 9: DevOps & Toolchains. Explain IBM Cloud Continuous Delivery service and Toolchains — what they are, how to create a toolchain from a template, how pipelines work (Classic vs Tekton), integrating GitHub/GitLab/IBM hosted Git, adding Slack notifications, deploying to IKS or Cloud Foundry from pipelines, and using the DevSecOps framework. Be practical and step-by-step.`,
    intro:"Step 9 is about IBM Cloud DevOps Toolchains — automating build, test, and deployment pipelines.",
    chips:["What is an IBM Cloud toolchain?","Classic pipeline vs Tekton pipeline?","How do I connect GitHub to a toolchain?","How do I deploy to IKS from a pipeline?"]
  },
  {
    title:"Monitoring & logging",
    desc:"Observe your workloads with IBM Cloud Monitoring and Log Analysis",
    icon:"chart-bar",
    system:`You are an IBM Cloud expert educator. The student is on Step 10: Monitoring & Logging. Cover IBM Cloud Monitoring (based on Sysdig) for metrics and dashboards, IBM Log Analysis (based on LogDNA) for log aggregation, IBM Cloud Activity Tracker for audit trails, and IBM Cloud Alerting. Show how to provision each service, connect agents to IKS clusters or VMs, write Sysdig PromQL queries, and create log-based alerts. This is the final step — also suggest next steps like IBM certifications (Cloud Associate, Cloud Professional).`,
    intro:"Final step! Step 10 covers observability — monitoring metrics, querying logs, and tracking activity on IBM Cloud.",
    chips:["How do I set up IBM Cloud Monitoring?","How does IBM Log Analysis work?","What is Activity Tracker?","What IBM Cloud certifications should I get next?"]
  }
];

const ICONS = {
  cloud:`<svg viewBox="0 0 24 24" fill="none" stroke="#0F62FE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>`,
  user:`<svg viewBox="0 0 24 24" fill="none" stroke="#0F62FE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
  terminal:`<svg viewBox="0 0 24 24" fill="none" stroke="#0F62FE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>`,
  shield:`<svg viewBox="0 0 24 24" fill="none" stroke="#0F62FE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>`,
  server:`<svg viewBox="0 0 24 24" fill="none" stroke="#0F62FE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>`,
  box:`<svg viewBox="0 0 24 24" fill="none" stroke="#0F62FE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>`,
  brain:`<svg viewBox="0 0 24 24" fill="none" stroke="#0F62FE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96-.46 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 4.44-1.14z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96-.46 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-4.44-1.14z"/></svg>`,
  database:`<svg viewBox="0 0 24 24" fill="none" stroke="#0F62FE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>`,
  'git-branch':`<svg viewBox="0 0 24 24" fill="none" stroke="#0F62FE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg>`,
  'chart-bar':`<svg viewBox="0 0 24 24" fill="none" stroke="#0F62FE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/><line x1="2" y1="20" x2="22" y2="20"/></svg>`
};

let currentStep = 0;
let histories = Array.from({length:10}, () => []);
let completedSteps = new Set();
let isLoading = false;

function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function formatMsg(text){
  let h = escHtml(text);
  h = h.replace(/```(\w*)\n?([\s\S]*?)```/g,(_,lang,code)=>`<pre>${code.trimEnd()}</pre>`);
  h = h.replace(/`([^`]+)`/g,'<code>$1</code>');
  h = h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  h = h.replace(/^### (.+)$/gm,'<p><strong>$1</strong></p>');
  h = h.replace(/^## (.+)$/gm,'<p><strong>$1</strong></p>');
  h = h.replace(/^- (.+)$/gm,'<li>$1</li>');
  h = h.replace(/(<li>[\s\S]*?<\/li>)/g,'<ul>$1</ul>');
  h = h.replace(/<\/ul>\s*<ul>/g,'');
  h = h.replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>');
  return '<p>'+h+'</p>';
}

function renderWelcome(){
  const s = STEPS[currentStep];
  const msgs = document.getElementById('messages');
  msgs.innerHTML = '';
  const card = document.createElement('div');
  card.className='welcome-card';
  card.innerHTML=`
    <div class="welcome-top">
      <div class="tool-icon">${ICONS[s.icon]||ICONS.cloud}</div>
      <div>
        <div class="welcome-title">Step ${currentStep+1}: ${s.title}</div>
        <div class="welcome-subtitle">${s.desc}</div>
      </div>
    </div>
    <div class="welcome-body">${s.intro}</div>
    <div class="chips">${s.chips.map(c=>`<button class="chip" onclick="sendChip(this)">${c}</button>`).join('')}</div>`;
  msgs.appendChild(card);
}

function renderHistory(){
  const msgs = document.getElementById('messages');
  msgs.innerHTML='';
  renderWelcome();
  const hist = histories[currentStep];
  for(const m of hist){
    appendBubble(m.role, m.content, false);
  }
  msgs.scrollTop = msgs.scrollHeight;
}

function appendBubble(role, content, animate=true){
  const msgs = document.getElementById('messages');
  const row = document.createElement('div');
  row.className=`msg-row ${role}`;
  if(!animate) row.style.animation='none';
  const av = document.createElement('div');
  av.className=`msg-avatar ${role==='user'?'user':'bot'}`;
  av.textContent=role==='user'?'You':'IBM';
  const bub = document.createElement('div');
  bub.className=`bubble ${role==='user'?'user':'bot'}`;
  bub.innerHTML=role==='user'?escHtml(content):formatMsg(content);
  row.appendChild(av);
  row.appendChild(bub);
  msgs.appendChild(row);
  msgs.scrollTop=msgs.scrollHeight;
}

function showTyping(){
  const msgs = document.getElementById('messages');
  const row = document.createElement('div');
  row.className='typing-row';row.id='typing';
  row.innerHTML=`<div class="msg-avatar bot" style="width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;background:#0F62FE;color:#fff;flex-shrink:0;margin-top:2px">IBM</div><div class="typing-dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`;
  msgs.appendChild(row);
  msgs.scrollTop=msgs.scrollHeight;
}

function removeTyping(){const t=document.getElementById('typing');if(t)t.remove();}

function updateBanner(){
  const s=STEPS[currentStep];
  document.getElementById('banner-tag').textContent=`Step ${currentStep+1} of ${STEPS.length}`;
  document.getElementById('banner-title').textContent=s.title;
  document.getElementById('banner-desc').textContent=s.desc;
  document.getElementById('prev-btn').disabled=currentStep===0;
  document.getElementById('next-btn').textContent=currentStep===STEPS.length-1?'Complete':'Next \u2192';
  const pct=Math.round((completedSteps.size/STEPS.length)*100);
  document.getElementById('prog-pct').textContent=pct+'%';
  document.getElementById('prog-fill').style.width=pct+'%';
  document.querySelectorAll('.step-btn').forEach((b,i)=>{
    b.classList.remove('active','done');
    if(i===currentStep) b.classList.add('active');
    else if(completedSteps.has(i)) b.classList.add('done');
  });
}

function switchStep(idx){
  completedSteps.add(currentStep);
  currentStep=idx;
  updateBanner();
  if(histories[currentStep].length>0) renderHistory();
  else renderWelcome();
}

function prevStep(){if(currentStep>0)switchStep(currentStep-1);}
function nextStep(){
  completedSteps.add(currentStep);
  if(currentStep<STEPS.length-1) switchStep(currentStep+1);
}

function sendChip(btn){
  const input=document.getElementById('user-input');
  input.value=btn.textContent;
  sendMessage();
}

function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,100)+'px';}
function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}}

async function sendMessage(){
  if(isLoading) return;
  const input=document.getElementById('user-input');
  const text=input.value.trim();
  if(!text) return;
  input.value='';input.style.height='auto';
  isLoading=true;
  document.getElementById('send-btn').disabled=true;

  const hist=histories[currentStep];
  hist.push({role:'user',content:text});
  appendBubble('user',text);
  showTyping();

  const msgs=hist.map(m=>({role:m.role,content:m.content}));

  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:1000,
        system:STEPS[currentStep].system,
        messages:msgs
      })
    });
    const data=await res.json();
    removeTyping();
    if(!res.ok) throw new Error(data.error?.message||'API error');
    const reply=data.content?.[0]?.text||'No response.';
    hist.push({role:'assistant',content:reply});
    appendBubble('assistant',reply);
  }catch(err){
    removeTyping();
    hist.pop();
    const msgs=document.getElementById('messages');
    const errDiv=document.createElement('div');
    errDiv.style.cssText='background:#FFF1F1;border:1px solid #FFCDD2;color:#C62828;padding:10px 14px;font-size:13px;margin-top:4px';
    errDiv.textContent='Error: '+(err.message||'Something went wrong.');
    msgs.appendChild(errDiv);
    msgs.scrollTop=msgs.scrollHeight;
  }
  isLoading=false;
  document.getElementById('send-btn').disabled=false;
  input.focus();
}

renderWelcome();
updateBanner();
</script>
